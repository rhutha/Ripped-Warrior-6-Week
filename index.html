<script>
const EX={"run":{"n":"Warm-up run / cardio","t":"Easy-to-moderate pace. Get the heart rate up without draining energy for the workout.","h":"10 min brisk walking pad (add incline), or 10 min of jumping jacks / high knees","i":"Jogging_Treadmill","m":["quadriceps"],"s":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than jogging outside. A 150 lb person will burn almost 250 calories jogging for 30 minutes, compared to more than 450 calories running. Maintain proper posture as you jog, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."]},"hrun":{"n":"Half-mile run","t":"Steady pace, about 4–6 minutes.","h":"5 min jog on the walking pad, or high knees in place","i":"Jogging_Treadmill","m":["quadriceps"],"s":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than jogging outside. A 150 lb person will burn almost 250 calories jogging for 30 minutes, compared to more than 450 calories running. Maintain proper posture as you jog, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."]},"rower":{"n":"Rower","t":"Legs drive first, then lean back, then pull the handle to your lower ribs. Reverse on the way back.","h":"5 min alternating 30s slam-ball slams + 30s band rows","i":"Rowing_Stationary","m":["quadriceps"],"s":["To begin, seat yourself on the rower. Make sure that your heels are resting comfortably against the base of the foot pedals and that the straps are secured. Select the program that you wish to use, if applicable. Sit up straight and bend forward at the hips.","There are three phases of movement when using a rower. The first phase is when you come forward on the rower. Your knees are bent and against your chest. Your upper body is leaning slightly forward while still maintaining good posture. Next, push against the foot pedals and extend your legs while bringing your hands to your upper abdominal area, squeezing your shoulders back as you do so. To avoid straining your back, use primarily your leg and hip muscles.","The recovery phase simply involves straightening your arms, bending the knees, and bringing your body forward again as you transition back into the first phase."]},"pu":{"n":"Push-ups","t":"Hands under shoulders, body in one straight line, chest to the floor, elbows about 45°.","i":"Pushups","m":["chest"],"s":["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.","Next, lower yourself downward until your chest almost touches the floor as you inhale.","Now breathe out and press your upper body back up to the starting position while squeezing your chest.","After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."]},"bsq":{"n":"Body squats","t":"Feet shoulder-width, sit hips back and down, chest up, knees track over toes.","i":"Bodyweight_Squat","m":["quadriceps"],"s":["Stand with your feet shoulder width apart. You can place your hands behind your head. This will be your starting position.","Begin the movement by flexing your knees and hips, sitting back with your hips.","Continue down to full depth if you are able,and quickly reverse the motion until you return to the starting position. As you squat, keep your head and chest up and push your knees out."]},"sqh":{"n":"Body squat hold","t":"Sit to parallel and hold. Chest up, weight in the heels, breathe.","i":"Bodyweight_Squat","m":["quadriceps"],"s":["Stand with your feet shoulder width apart. You can place your hands behind your head. This will be your starting position.","Begin the movement by flexing your knees and hips, sitting back with your hips.","Continue down to full depth if you are able,and quickly reverse the motion until you return to the starting position. As you squat, keep your head and chest up and push your knees out."]},"lng":{"n":"Body lunges","t":"Long step, back knee kisses the floor, front knee stays over the ankle.","i":"Bodyweight_Walking_Lunge","m":["quadriceps"],"s":["Begin standing with your feet shoulder width apart and your hands on your hips.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."]},"stap":{"n":"Shoulder taps","t":"High plank, feet wide. Tap the opposite shoulder without rocking your hips."},"pkh":{"n":"Plank hold (push-up position)","t":"Arms straight, squeeze glutes and abs, body in one line. Don't let the hips sag."},"puj":{"n":"Pull-up jumps","t":"Stand under the bar, dip and jump to grab it, pull briefly, then land softly. Fast, springy reps.","h":"Jump and reach overhead as high as you can (no bar), or use a doorway bar"},"prot":{"n":"Small plate side-to-side rotations","t":"Hold a light plate at chest height and rotate side to side from the ribs, hips facing forward.","h":"Use the slam ball or one dumbbell"},"praise":{"n":"Front small plate raises","t":"Arms almost straight, raise the plate to eye level, then lower slowly.","h":"Use the slam ball or one 8 kg dumbbell held with both hands","i":"Front_Plate_Raise","m":["shoulders"],"s":["While standing straight, hold a barbell plate in both hands at the 3 and 9 o'clock positions. Your palms should be facing each other and your arms should be extended and locked with a slight bend at the elbows and the plate should be down near your waist in front of you as far as you can go. Tip: The arms will remain in this position throughout the exercise. This will be your starting position.","Slowly raise the plate as you exhale until it is a little above shoulder level. Hold the contraction for a second. Tip: make sure that you do not swing the weight or bend at the elbows. Your torso should remain stationary throughout the movement as well.","As you inhale, slowly lower the plate back down to the starting position.","Repeat for the recommended amount of repetitions."]},"fbdp":{"n":"Flat bench dumbbell press","t":"Shoulder blades squeezed together, press up and slightly in, lower to chest level.","h":"Floor press with your 8 kg dumbbells","i":"Dumbbell_Bench_Press","m":["chest"],"s":["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.","Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions of your training program."]},"idp":{"n":"Incline dumbbell press","t":"Bench at 30°, press over the upper chest, control the lowering.","h":"Prop your upper back on cushions or the sofa edge and press","i":"Incline_Dumbbell_Press","m":["chest"],"s":["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.","Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.","Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."]},"clap":{"n":"Clapping push-ups","t":"Lower under control, explode up so your hands leave the floor, clap, land with soft elbows.","h":"Same. Easier: explosive push-ups without the clap, or on your knees","i":"Plyo_Push-up","m":["chest"],"s":["Move into a prone position on the floor, supporting your weight on your hands and toes.","Your arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement. This will be your starting position.","Descend by flexing at the elbow, lowering your chest towards the ground.","At the bottom, reverse the motion by pushing yourself up through elbow extension as quickly as possible. Attempt to push your upper body up until your hands leave the ground.","Return to the starting position and repeat the exercise.","For added difficulty, add claps into the movement while you are air borne."]},"ppress":{"n":"Flat bench plate press","t":"Squeeze a plate between your palms at the chest and press straight up, squeezing hard the whole time.","h":"Lie on the floor and squeeze the slam ball or one dumbbell between your palms"},"dips":{"n":"Bodyweight dips","t":"Hands on the bench behind you, elbows point back, lower until the elbows reach 90°, press up.","h":"Chair or bed-edge dips","i":"Bench_Dips","m":["triceps"],"s":["For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.","Slowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.","Using your triceps to bring your torso up again, lift yourself back to the starting position.","Repeat for the recommended amount of repetitions."]},"tiger":{"n":"Tiger-bend push-ups","t":"From a forearm plank, press up onto your hands, then lower back to the forearms. Hard on the triceps."},"cgdp":{"n":"Close-grip dumbbell press","t":"Dumbbells touching, palms facing in, elbows tucked. Press up and squeeze the triceps.","h":"Floor press with dumbbells touching","i":"Close-Grip_Dumbbell_Press","m":["triceps"],"s":["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench with only your shoulders lying on the surface. Hips should be below the bench and your legs bent with your feet firmly on the floor.","Grasp the dumbbell with both hands and hold it straight over your chest at arm's length. Both palms should be pressing against the underside of the sides of the dumbbell. This will be your starting position.","Initiate the movement by lowering the dumbbell to your chest.","Return to the starting position by extending the elbows."]},"aidp":{"n":"Alternating incline dumbbell press","t":"Keep one arm locked out while the other presses, then switch.","h":"Upper back propped on the sofa edge or cushions","i":"Incline_Dumbbell_Press","m":["chest"],"s":["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.","Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.","Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."]},"ipp":{"n":"Incline plate press","t":"Plate squeezed between the palms, press up from the upper chest on an incline bench.","h":"Propped on cushions, squeeze the slam ball"},"wpu":{"n":"Wide push-ups","t":"Hands wider than shoulders to hit more chest. Full range.","i":"Push-Up_Wide","m":["chest"],"s":["With your hands wide apart, support your body on your toes and hands in a plank position. Your elbows should be extended and your body straight. Do not allow your hips to sag. This will be your starting position.","To begin, allow the elbows to flex, lowering your chest to the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position by extending the elbows. Exhale as you perform this step.","After pausing at the contracted position, repeat the movement for the prescribed amount of repetitions."]},"pte":{"n":"Plank triceps extensions","t":"From a forearm plank, push through the palms to straighten the elbows, then lower back down slowly."},"bpu":{"n":"Resistance-band push-ups","t":"Band across your upper back, ends pinned under your hands. Push against the band.","i":"Pushups","m":["chest"],"s":["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.","Next, lower yourself downward until your chest almost touches the floor as you inhale.","Now breathe out and press your upper body back up to the starting position while squeezing your chest.","After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."]},"bfp":{"n":"Front press with resistance band","t":"Band behind your back at chest height. Punch both hands straight forward, then return slowly."},"bbsq":{"n":"Barbell squat","t":"Bar on the upper back, brace hard, sit down between the hips to parallel, drive up.","h":"Goblet squat with the 8 kg kettlebell, 3s lowering","i":"Barbell_Squat","m":["quadriceps"],"s":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},"stepup":{"n":"Step-ups","t":"Whole foot on the box, drive through the heel, don't push off the back leg.","h":"Sturdy stair or low bed edge","i":"Dumbbell_Step_Ups","m":["quadriceps"],"s":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.","Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."]},"sldl":{"n":"Dumbbell straight-leg deadlift","t":"Soft knees, push hips back, dumbbells slide down the legs, flat back, feel the hamstrings.","i":"Stiff-Legged_Dumbbell_Deadlift","m":["hamstrings"],"s":["Grasp a couple of dumbbells holding them by your side at arm's length.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."]},"kbsw":{"n":"Kettlebell swing","t":"Hip hinge, not a squat. Snap the hips to float the bell to chest height; the arms are just ropes.","i":"One-Arm_Kettlebell_Swings","m":["hamstrings"],"s":[]},"bwl":{"n":"Straight-bar walking lunges","t":"Bar on your back, long steps, torso tall, back knee nearly touches the floor.","h":"Dumbbell walking or stationary lunges","i":"Barbell_Walking_Lunge","m":["quadriceps"],"s":["Begin standing with your feet shoulder width apart and a barbell across your upper back.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."]},"ptaps":{"n":"Plank taps","t":"High plank, tap the opposite shoulder and keep your hips still. Steady pace for the full minute."},"mbt":{"n":"Med ball twists","t":"Sit, lean back 45°, rotate the ball side to side from the ribs.","h":"Use the 4 kg slam ball","i":"Russian_Twist","m":["abdominals"],"s":["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Your arms should be fully extended in front of you perpendicular to your torso and with the hands clasped. This is the starting position.","Twist your torso to the right side until your arms are parallel with the floor while breathing out.","Hold the contraction for a second and move back to the starting position while breathing out. Now move to the opposite side performing the same techniques you applied to the right side.","Repeat for the recommended amount of repetitions."]},"s2s":{"n":"Sides to sides","t":"Stay low and shuffle or hop quickly side to side. Light feet."},"burp":{"n":"Burpees","t":"Squat, hands down, jump back to plank, chest down, jump the feet in, jump up.","h":"Quiet version: step back and forward, no jump"},"jj":{"n":"Jumping jacks","t":"Stay light on the toes, arms all the way overhead.","h":"Quiet version: step-jacks"},"fly":{"n":"Fly position, thumbs down: in & out","t":"Arms out to the sides at shoulder height, thumbs pointing down. Slowly bring the arms in and out to open the shoulders."},"hipf":{"n":"Hip-flexor stretch","t":"Half-kneel, squeeze the back glute, shift the hips forward.","i":"Kneeling_Hip_Flexor","m":["quadriceps"],"s":["Kneel on a mat and bring your right knee up so the bottom of your foot is on the floor and extend your left leg out behind you so the top of your foot is on the floor.","Shift your weight forward until you feel a stretch in your hip. Hold for 15 seconds, then repeat for your other side."]},"hipfu":{"n":"Hip-flexor stretch to get-up","t":"From the half-kneel stretch, drive up to standing and back down with control.","i":"Kneeling_Hip_Flexor","m":["quadriceps"],"s":["Kneel on a mat and bring your right knee up so the bottom of your foot is on the floor and extend your left leg out behind you so the top of your foot is on the floor.","Shift your weight forward until you feel a stretch in your hip. Hold for 15 seconds, then repeat for your other side."]},"splitr":{"n":"Split-stance stretch with overhead reach","t":"Long split stance, back knee low, reach both arms overhead and slightly back."},"legst":{"n":"Leg stretch","t":"Heel forward, toes up, hinge at the hips until the hamstring stretches.","i":"Standing_Hamstring_and_Calf_Stretch","m":["hamstrings"],"s":["Being by looping a belt, band, or rope around one foot. While standing, place that foot forward.","Bend your back leg, while keeping the front one straight. Now raise the toes of your front foot off of the ground and lean forward.","Using the belt, pull on the top of the foot to increase the stretch in the calf. Hold for 10-20 seconds and repeat with the other foot."]},"s2sslam":{"n":"Side-to-side ball slams","t":"Ball overhead, rotate and slam it beside one foot, then the other. Power from the hips.","h":"Use your 4 kg slam ball","i":"Overhead_Slam","m":["lats"],"s":["Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.","Initiate the countermovement by raising the ball above your head and fully extending your body.","Reverse the motion, slamming the ball into the ground directly in front of you as hard as you can.","Receive the ball with both hands on the bounce and repeat the movement."]},"sbox":{"n":"Shadow boxing side to side with sprawl","t":"Throw quick punches while moving side to side, then sprawl: kick the legs back and drop the hips, then pop back up."},"renrow":{"n":"Renegade rows","t":"Plank on dumbbells, feet wide. Row one dumbbell without twisting the hips, then alternate.","i":"Alternating_Renegade_Row","m":["middle back"],"s":["Place two kettlebells on the floor about shoulder width apart. Position yourself on your toes and your hands as though you were doing a pushup, with the body straight and extended. Use the handles of the kettlebells to support your upper body. You may need to position your feet wide for support.","Push one kettlebell into the floor and row the other kettlebell, retracting the shoulder blade of the working side as you flex the elbow, pulling it to your side.","Then lower the kettlebell to the floor and begin the kettlebell in the opposite hand. Repeat for several reps."]},"sled":{"n":"Sled push","t":"Low body angle, arms locked, drive with short powerful steps.","h":"30s of hard high knees or mountain climbers, driving as if pushing a sled","i":"Sled_Push","m":["quadriceps"],"s":["Load your pushing sled with the desired weight.","Take an athletic posture, leaning into the sled with your arms fully extended, grasping the handles. Push the sled as fast as possible, focusing on extending your hips and knees to strengthen your posterior chain."]},"lbt":{"n":"Laying-down ball throws","t":"Lie on your back and throw the ball straight up from the chest, catch it, repeat.","h":"Press the slam ball up and catch it, or do sit-up throws against a wall","i":"Supine_Chest_Throw","m":["triceps"],"s":["This drill is great for chest passes when you lack a partner or a wall of sufficient strength. Lay on the ground on your back with your knees bent.","Begin with the ball on your chest, held with both hands on the bottom.","Explode up, extending through the elbow to throw the ball directly above you as high as possible.","Catch the ball with both hands as it comes down."]},"mc":{"n":"Mountain climbers","t":"Plank, drive the knees to the chest fast, hips low, shoulders over the wrists.","i":"Mountain_Climbers","m":["quadriceps"],"s":["Begin in a pushup position, with your weight supported by your hands and toes. Flexing the knee and hip, bring one leg until the knee is approximately under the hip. This will be your starting position.","Explosively reverse the positions of your legs, extending the bent leg until the leg is straight and supported by the toe, and bringing the other foot up with the hip and knee flexed. Repeat in an alternating fashion for 20-30 seconds."]},"brs":{"n":"Battle rope slams","t":"Both arms up, then slam the ropes down hard using the whole body. Athletic stance.","h":"Slam-ball slams, or band double-arm slams with the band anchored low","i":"Battling_Ropes","m":["shoulders"],"s":["For this exercise you will need a heavy rope anchored at its center 15-20 feet away. Standing in front of the rope, take an end in each hand with your arms extended at your side. This will be your starting position.","Initiate the movement by rapidly raising one arm to shoulder level as quickly as you can.","As you let that arm drop to the starting position, raise the opposite side.","Continue alternating your left and right arms, whipping the ropes up and down as fast as you can."]},"prs":{"n":"Plank rope slams","t":"High plank holding a rope in one hand, make fast waves without rotating the hips. Switch hands halfway.","h":"Fast plank shoulder taps"},"brw":{"n":"Battle rope waves","t":"Alternate arms quickly to make waves, half-squat stance, core tight.","h":"Band waves (anchored low) or fast alternating dumbbell punches","i":"Battling_Ropes","m":["shoulders"],"s":["For this exercise you will need a heavy rope anchored at its center 15-20 feet away. Standing in front of the rope, take an end in each hand with your arms extended at your side. This will be your starting position.","Initiate the movement by rapidly raising one arm to shoulder level as quickly as you can.","As you let that arm drop to the starting position, raise the opposite side.","Continue alternating your left and right arms, whipping the ropes up and down as fast as you can."]},"sbr":{"n":"Shadow boxing with ropes","t":"Hold the ropes and throw punches so the ropes make waves.","h":"Shadow boxing holding light dumbbells","i":"Battling_Ropes","m":["shoulders"],"s":["For this exercise you will need a heavy rope anchored at its center 15-20 feet away. Standing in front of the rope, take an end in each hand with your arms extended at your side. This will be your starting position.","Initiate the movement by rapidly raising one arm to shoulder level as quickly as you can.","As you let that arm drop to the starting position, raise the opposite side.","Continue alternating your left and right arms, whipping the ropes up and down as fast as you can."]},"sproll":{"n":"Spine roll to wide-leg and closed-leg stretch","t":"Roll slowly through the spine, then sit and fold over wide legs, then legs together."},"ksw":{"n":"Kneeling spine wave","t":"On all fours, roll through the spine one segment at a time, like a wave.","i":"Cat_Stretch","m":["lower back"],"s":["Position yourself on the floor on your hands and knees.","Pull your belly in and round your spine, lower back, shoulders, and neck, letting your head drop.","Hold for 15 seconds."]},"sls":{"n":"Standing leg stretch","t":"Heel forward, hinge at the hips, hold each leg.","i":"Standing_Hamstring_and_Calf_Stretch","m":["hamstrings"],"s":["Being by looping a belt, band, or rope around one foot. While standing, place that foot forward.","Bend your back leg, while keeping the front one straight. Now raise the toes of your front foot off of the ground and lean forward.","Using the belt, pull on the top of the foot to increase the stretch in the calf. Hold for 10-20 seconds and repeat with the other foot."]},"bcurl":{"n":"Bar curl","t":"Elbows pinned to the sides, curl and squeeze, lower in 2–3 s.","h":"Dumbbell curls","i":"Barbell_Curl","m":["biceps"],"s":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},"rpu":{"n":"Bar reverse push-ups (inverted row)","t":"Hang under a bar with the body straight, pull your chest to the bar, squeeze the back.","h":"Under a sturdy table, grip the edge and pull the chest up, or do band rows","i":"Inverted_Row","m":["middle back"],"s":["Position a bar in a rack to about waist height. You can also use a smith machine.","Take a wider than shoulder width grip on the bar and position yourself hanging underneath the bar. Your body should be straight with your heels on the ground with your arms fully extended. This will be your starting position.","Begin by flexing the elbow, pulling your chest towards the bar. Retract your shoulder blades as you perform the movement.","Pause at the top of the motion, and return yourself to the start position.","Repeat for the desired number of repetitions."]},"pcurl":{"n":"Plank dumbbell curls","t":"High plank with a dumbbell in one hand. Curl it without rotating the hips, then switch."},"wpull":{"n":"Weighted pull-ups","t":"Dead hang, pull the chest toward the bar, chin over. Add weight only when the reps are clean.","h":"Doorway-bar pull-ups, or band lat pulldowns (slow 10, 8, 6, 4)","i":"Weighted_Pull_Ups","m":["lats"],"s":["Attach a weight to a dip belt and secure it around your waist. Grab the pull-up bar with the palms of your hands facing forward. For a medium grip, your hands should be spaced at shoulder width. Both arms should be extended in front of you holding the bar at the chosen grip.","You'll want to bring your torso back about 30 degrees while creating a curvature in your lower back and sticking your chest out. This will be your starting position.","Now, exhale and pull your torso up until your head is above your hands. Concentrate on squeezing yourshoulder blades back and down as you reach the top contracted position.","After a brief moment at the top contracted position, inhale and slowly lower your torso back to the starting position with your arms extended and your lats fully stretched."]},"scr":{"n":"Seated cable rows","t":"Chest tall, pull to the belly, squeeze the shoulder blades, no leaning back.","h":"Band seated row (band around your feet)","i":"Seated_Cable_Rows","m":["middle back"],"s":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."]},"ihc":{"n":"Incline bench alternating hammer curls","t":"Lie back on the incline, arms hanging, palms facing in. Curl one arm at a time.","h":"Seated hammer curls leaning back on the sofa","i":"Incline_Hammer_Curls","m":["biceps"],"s":["Seat yourself on an incline bench with a dumbbell in each hand. You should pressed firmly against he back with your feet together. Allow the dumbbells to hang straight down at your side, holding them with a neutral grip. This will be your starting position.","Initiate the movement by flexing at the elbow, attempting to keep the upper arm stationary.","Continue to the top of the movement and pause, then slowly return to the start position."]},"dlr":{"n":"Barbell deadlift to row","t":"Deadlift up, hinge forward to about 45°, row the bar to your belly, then lower and repeat.","h":"Dumbbell Romanian deadlift, then a bent-over dumbbell row","i":"Barbell_Deadlift","m":["lower back"],"s":["Stand in front of a loaded barbell.","While keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.","While holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.","Go back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.","Perform the amount of repetitions prescribed in the program."]},"dbj":{"n":"Standing dumbbell jabs","t":"Light dumbbells, guard up, fast straight punches, alternating arms."},"alng":{"n":"Alternating lunges","t":"Step forward, drop the back knee, push back, switch legs.","i":"Dumbbell_Lunges","m":["quadriceps"],"s":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step forward with your right leg around 2 feet or so from the foot being left stationary behind and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground.","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."]},"vsj":{"n":"V-sit dumbbell jabs","t":"Balance in a V-sit with the feet up and punch with light dumbbells, alternating arms."},"lhop":{"n":"Lateral hops","t":"Two-foot hops side to side over a line. Quick and light."},"sdp":{"n":"Standing dumbbell shoulder press","t":"Brace the abs, press overhead, don't lean back.","i":"Standing_Dumbbell_Press","m":["shoulders"],"s":["Standing with your feet shoulder width apart, take a dumbbell in each hand. Raise the dumbbells to head height, the elbows out and about 90 degrees. This will be your starting position.","Maintaining strict technique with no leg drive or leaning back, extend through the elbow to raise the weights together directly above your head.","Pause, and slowly return the weight to the starting position."]},"sqp":{"n":"Squat punches","t":"Squat down, then stand up and throw a punch, alternating arms."},"acs":{"n":"Standing arm curl to overhead stretch (band)","t":"Hold the band and curl up, then reach overhead into a long stretch."},"fpb":{"n":"Forward press (band)","t":"Band behind the back, press forward slowly for 10 reps."},"arot":{"n":"Arm rotations","t":"Arms out, make slow circles backward.","i":"Arm_Circles","m":["shoulders"],"s":["Stand up and extend your arms straight out by the sides. The arms should be parallel to the floor and perpendicular (90-degree angle) to your torso. This will be your starting position.","Slowly start to make circles of about 1 foot in diameter with each outstretched arm. Breathe normally as you perform the movement.","Continue the circular motion of the outstretched arms for about ten seconds. Then reverse the movement, going the opposite direction."]},"arotf":{"n":"Arm rotations forward","t":"Arms out, make slow circles forward.","i":"Arm_Circles","m":["shoulders"],"s":["Stand up and extend your arms straight out by the sides. The arms should be parallel to the floor and perpendicular (90-degree angle) to your torso. This will be your starting position.","Slowly start to make circles of about 1 foot in diameter with each outstretched arm. Breathe normally as you perform the movement.","Continue the circular motion of the outstretched arms for about ten seconds. Then reverse the movement, going the opposite direction."]},"sahp":{"n":"Standing alternating hammer dumbbell press","t":"Palms facing in, press one arm at a time, ribs down, no leaning back.","i":"Standing_Alternating_Dumbbell_Press","m":["shoulders"],"s":["Stand with a dumbbell in each hand. Raise the dumbbells to your shoulders with your palms facing forward and your elbows pointed out. This will be your starting position.","Extend one arm to press the dumbbell straight up, keeping your off hand in place. Do not lean or jerk the weight during the movement.","After a brief pause, return the weight to the starting position.","Repeat for the opposite side, continuing to alternate between arms."]},"sdfly":{"n":"Standing dumbbell flys (lateral raise)","t":"Slight bend in the elbows, raise the arms out to the sides to shoulder height, lower slowly.","i":"Side_Lateral_Raise","m":["shoulders"],"s":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},"dfr":{"n":"Dumbbell front raises","t":"Raise to eye level with straight arms, control the lowering.","i":"Front_Dumbbell_Raise","m":["shoulders"],"s":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the left dumbbell to the front with a slight bend on the elbow and the palms of the hands always facing down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top. Inhale after the second pause.","Now lower the dumbbell back down slowly to the starting position as you simultaneously lift the right dumbbell.","Continue alternating in this fashion until all of the recommended amount of repetitions have been performed for each arm."]},"b2s":{"n":"Bridge to sit-up","t":"Lift the hips into a glute bridge, lower, then sit all the way up. That is 1 rep."},"lsit":{"n":"L-sit hold (or plank walks to mountain climbers)","t":"Hands by the hips, press down and lift the legs straight out. Too hard? Plank walk-outs into mountain climbers.","h":"L-sit between two chairs or on the floor with tucked knees"},"bdf":{"n":"Bending dumbbell flys","t":"Hinge forward with a flat back and raise the dumbbells out to the sides. Squeeze the upper back.","i":"Seated_Bent-Over_Rear_Delt_Raise","m":["shoulders"],"s":["Place a couple of dumbbells looking forward in front of a flat bench.","Sit on the end of the bench with your legs together and the dumbbells behind your calves.","Bend at the waist while keeping the back straight in order to pick up the dumbbells. The palms of your hands should be facing each other as you pick them. This will be your starting position.","Keeping your torso forward and stationary, and the arms slightly bent at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. (Note: avoid swinging the torso or bringing the arms back as opposed to the side.)","After a one second contraction at the top, slowly lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},"bps":{"n":"Ball press to slam","t":"Press the ball overhead, then slam it down hard. Squat to pick it up.","h":"Use your 4 kg slam ball","i":"Overhead_Slam","m":["lats"],"s":["Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.","Initiate the countermovement by raising the ball above your head and fully extending your body.","Reverse the motion, slamming the ball into the ground directly in front of you as hard as you can.","Receive the ball with both hands on the bounce and repeat the movement."]},"situp":{"n":"Sit-ups","t":"Knees bent, roll all the way up, lower with control.","i":"Sit-Up","m":["abdominals"],"s":["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Place your hands behind your head and lock them together by clasping your fingers. This is the starting position.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Breathe out when performing this part of the exercise.","Once you feel the contraction for a second, lower your upper body back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]},"jsq":{"n":"Jumping squats","t":"Squat, explode up, land softly back into the squat.","h":"Quiet version: fast squats rising onto your toes","i":"Freehand_Jump_Squat","m":["quadriceps"],"s":["Cross your arms over your chest.","With your head up and your back straight, position your feet at shoulder width.","Keeping your back straight and chest up, squat down as you inhale until your upper thighs are parallel, or lower, to the floor.","Now pressing mainly with the ball of your feet, jump straight up in the air as high as possible, using the thighs like springs. Exhale during this portion of the movement.","When you touch the floor again, immediately squat down and jump again.","Repeat for the recommended amount of repetitions."]},"ipu":{"n":"Inverted pull-ups","t":"Body straight under a bar, pull your chest up to it.","h":"Table rows (sturdy table) or band rows","i":"Inverted_Row","m":["middle back"],"s":["Position a bar in a rack to about waist height. You can also use a smith machine.","Take a wider than shoulder width grip on the bar and position yourself hanging underneath the bar. Your body should be straight with your heels on the ground with your arms fully extended. This will be your starting position.","Begin by flexing the elbow, pulling your chest towards the bar. Retract your shoulder blades as you perform the movement.","Pause at the top of the motion, and return yourself to the start position.","Repeat for the desired number of repetitions."]},"hout":{"n":"Standing with hands out","t":"Stand tall, arms out wide, slow deep breaths. Repeat a few times."},"chb":{"n":"Chair pose → beast wave → push-up plank","t":"Chair pose for 10s, flow into beast pose and wave through the spine, then hold a high plank for 10s."},"armos":{"n":"Arm overhead stretch with rotation","t":"Arms overhead, lean and rotate gently to each side."},"araise":{"n":"Arm raises","t":"Raise straight arms forward and up overhead, slowly."},"armc":{"n":"Arm circles","t":"Small to big circles in both directions.","i":"Arm_Circles","m":["shoulders"],"s":["Stand up and extend your arms straight out by the sides. The arms should be parallel to the floor and perpendicular (90-degree angle) to your torso. This will be your starting position.","Slowly start to make circles of about 1 foot in diameter with each outstretched arm. Breathe normally as you perform the movement.","Continue the circular motion of the outstretched arms for about ten seconds. Then reverse the movement, going the opposite direction."]},"armio":{"n":"Arm ins and outs","t":"Arms out at shoulder height, bring them in front of the chest and back out."},"jog":{"n":"Light jog or mellow hike","t":"Easy pace, 30 minutes maximum. Keep moving, but recovery is the goal.","h":"Walking pad at an easy pace","i":"Jogging_Treadmill","m":["quadriceps"],"s":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than jogging outside. A 150 lb person will burn almost 250 calories jogging for 30 minutes, compared to more than 450 calories running. Maintain proper posture as you jog, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."]},"brwp":{"n":"Battle rope waves → plank rope slams","t":"Waves standing, then drop to a plank and slam one-handed. Keep switching for the whole interval.","h":"Band waves, then plank shoulder taps","i":"Battling_Ropes","m":["shoulders"],"s":["For this exercise you will need a heavy rope anchored at its center 15-20 feet away. Standing in front of the rope, take an end in each hand with your arms extended at your side. This will be your starting position.","Initiate the movement by rapidly raising one arm to shoulder level as quickly as you can.","As you let that arm drop to the starting position, raise the opposite side.","Continue alternating your left and right arms, whipping the ropes up and down as fast as you can."]},"bjbt":{"n":"Resistance-band jumps → ball throws","t":"Jump against the band, then explosive ball chest-throws. Alternate for the interval.","h":"Squat jumps, then slam-ball chest passes against a wall","i":"Medicine_Ball_Chest_Pass","m":["chest"],"s":["You will need a partner for this exercise. Lacking one, this movement can be performed against a wall.","Begin facing your partner holding the medicine ball at your torso with both hands.","Pull the ball to your chest, and reverse the motion by extending through the elbows. For sports applications, you can take a step as you throw.","Your partner should catch the ball, and throw it back to you.","Receive the throw with both hands at chest height."]},"dsjs":{"n":"Dumbbell squat → jumping squat","t":"One dumbbell squat, put the weights down, one jump squat. That is 1 rep.","i":"Dumbbell_Squat","m":["quadriceps"],"s":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise your torso as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},"bjcp":{"n":"Box jump → clapping push-up","t":"Jump onto the box, step down, drop into a clapping push-up.","h":"Squat jump (no box), then a clapping or explosive push-up","i":"Front_Box_Jump","m":["hamstrings"],"s":["Begin with a box of an appropriate height 1-2 feet in front of you. Stand with your feet should width apart. This will be your starting position.","Perform a short squat in preparation for jumping, swinging your arms behind you.","Rebound out of this position, extending through the hips, knees, and ankles to jump as high as possible. Swing your arms forward and up.","Land on the box with the knees bent, absorbing the impact through the legs. You can jump from the box back to the ground, or preferably step down one leg at a time."]},"rsb":{"n":"Battle rope shadow boxing","t":"Hold the ropes and punch so they make fast waves.","h":"Shadow boxing with light dumbbells","i":"Battling_Ropes","m":["shoulders"],"s":["For this exercise you will need a heavy rope anchored at its center 15-20 feet away. Standing in front of the rope, take an end in each hand with your arms extended at your side. This will be your starting position.","Initiate the movement by rapidly raising one arm to shoulder level as quickly as you can.","As you let that arm drop to the starting position, raise the opposite side.","Continue alternating your left and right arms, whipping the ropes up and down as fast as you can."]},"bst":{"n":"Ball slam throws","t":"Slam hard, catch it on the bounce, go again.","h":"Slam ball","i":"Overhead_Slam","m":["lats"],"s":["Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.","Initiate the countermovement by raising the ball above your head and fully extending your body.","Reverse the motion, slamming the ball into the ground directly in front of you as hard as you can.","Receive the ball with both hands on the bounce and repeat the movement."]},"lhs":{"n":"Lateral hops to sprint","t":"A few quick side hops, then sprint forward a few steps. Repeat.","h":"Lateral hops, then sprint in place"},"djl":{"n":"Dumbbell jumping lunges","t":"Light dumbbells at your sides, jump and switch legs in mid-air, land soft.","i":"Split_Jump","m":["quadriceps"],"s":["Assume a lunge stance position with one foot forward with the knee bent, and the rear knee nearly touching the ground.","Ensure that the front knee is over the midline of the foot.","Extending through both legs, jump as high as possible, swinging your arms to gain lift.","As you jump, bring your feet together, and move them back to their initial positions as you land.","Absorb the impact by reverting back to the starting position."]},"dbrow":{"n":"Dumbbell rows","t":"Flat back, pull the dumbbells to the hips, squeeze the shoulder blades.","i":"One-Arm_Dumbbell_Row","m":["middle back"],"s":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions.","Switch sides and repeat again with the other arm."]},"thr":{"n":"Dumbbell thrusters","t":"Weights at the shoulders, squat deep, drive up and press overhead in one motion.","i":"Kettlebell_Thruster","m":["shoulders"],"s":["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so. This will be your starting position.","Begin to squat by flexing your hips and knees, lowering your hips between your legs. Maintain an upright, straight back as you descend as low as you can.","At the bottom, reverse direction and squat by extending your knees and hips, driving through your heels. As you do so, press both kettlebells overhead by extending your arms straight up, using the momentum from the squat to help drive the weights upward.","As you begin the next repetition, return the weights to the shoulders."]},"kbcs":{"n":"Kettlebell clean to squat","t":"Clean the bell to the chest, then squat holding it. That is 1 rep.","i":"Two-Arm_Kettlebell_Clean","m":["shoulders"],"s":["Place two kettlebells between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean the kettlebells to your shoulders by extending through the legs and hips as you raise the kettlebells towards your shoulders. Rotate your wrists as you do so.","Lower the kettlebells back to the starting position and repeat."]},"wpp":{"n":"Walking plank to push-up","t":"Walk the hands out to a plank, do a push-up, walk back in.","i":"Inchworm","m":["hamstrings"],"s":["Stand with your feet close together. Keeping your legs straight, stretch down and put your hands on the floor directly in front of you. This will be your starting position.","Begin by walking your hands forward slowly, alternating your left and your right. As you do so, bend only at the hip, keeping your legs straight.","Keep going until your body is parallel to the ground in a pushup position.","Now, keep your hands in place and slowly take short steps with your feet, moving only a few inches at a time.","Continue walking until your feet are by hour hands, keeping your legs straight as you do so."]},"sqr":{"n":"Squat hold to reach","t":"Deep squat, then reach one arm up to the ceiling and rotate. Alternate sides."},"sst":{"n":"Side stretch","t":"Arms overhead and lean to each side. Long, slow breaths."},"beast":{"n":"Beast pose hold","t":"On all fours, knees hovering 2–3 cm off the floor, back flat. Hold."},"sbc":{"n":"Straight-bar curls: close, standard, wide grip","t":"Do the reps with a close grip, then standard, then wide, with no rest between grips.","h":"Dumbbell curls: palms in, then normal, then rotated out","i":"Close-Grip_Standing_Barbell_Curl","m":["biceps"],"s":["Hold a barbell with both hands, palms up and a few inches apart.","Stand with your torso straight and your head up. Your feet should be about shoulder width and your elbows close to your torso. This will be your starting position. Tip: You will keep your upper arms and elbows stationary throughout the movement.","Curl the bar up in a semicircular motion until the forearms touch your biceps. Exhale as you perform this portion of the movement and contract your biceps hard for a second at the top. Tip: Avoid bending the back or using swinging motions as you lift the weight. Only the forearms should move.","Slowly go back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},"shc":{"n":"Spider hammer curls","t":"Chest on an incline bench, arms hanging straight down, hammer curl with no swinging.","h":"Lie face down on the bed edge with the arms hanging, then curl","i":"Spider_Curl","m":["biceps"],"s":["Start out by setting the bar on the part of the preacher bench that you would normally sit on. Make sure to align the barbell properly so that it is balanced and will not fall off.","Move to the front side of the preacher bench (the part where the arms usually lay) and position yourself to lay at a 45 degree slant with your torso and stomach pressed against the front side of the preacher bench.","Make sure that your feet (especially the toes) are well positioned on the floor and place your upper arms on top of the pad located on the inside part of the preacher bench.","Use your arms to grab the barbell with a supinated grip (palms facing up) at about shoulder width apart or slightly closer from each other.","Slowly begin to lift the barbell upwards and exhale. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the barbell back to the starting position as your breathe in. .","Repeat for the recommended amount of repetitions."]},"idar":{"n":"Incline dumbbell alternating row","t":"Chest on an incline bench, row one arm at a time, squeeze.","h":"Bent-over alternating dumbbell rows","i":"Dumbbell_Incline_Row","m":["middle back"],"s":["Using a neutral grip, lean into an incline bench.","Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. This will be your starting position.","Retract the shoulder blades and flex the elbows to row the dumbbells to your side.","Pause at the top of the motion, and then return to the starting position."]},"rbc":{"n":"Reverse straight-bar curls","t":"Overhand grip, curl up with the elbows still. Builds the forearms.","h":"Reverse-grip dumbbell curls","i":"Reverse_Barbell_Curl","m":["biceps"],"s":["Stand up with your torso upright while holding a barbell at shoulder width with the elbows close to the torso. The palm of your hands should be facing down (pronated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},"dlpu":{"n":"Deadlift to push-ups","t":"Deadlift the dumbbells, lower them to the floor, do a push-up on them, stand up.","i":"Stiff-Legged_Dumbbell_Deadlift","m":["hamstrings"],"s":["Grasp a couple of dumbbells holding them by your side at arm's length.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."]},"rrpu":{"n":"Renegade row to push-up","t":"Row left, row right, then one push-up. That is 1 rep.","i":"Alternating_Renegade_Row","m":["middle back"],"s":["Place two kettlebells on the floor about shoulder width apart. Position yourself on your toes and your hands as though you were doing a pushup, with the body straight and extended. Use the handles of the kettlebells to support your upper body. You may need to position your feet wide for support.","Push one kettlebell into the floor and row the other kettlebell, retracting the shoulder blade of the working side as you flex the elbow, pulling it to your side.","Then lower the kettlebell to the floor and begin the kettlebell in the opposite hand. Repeat for several reps."]},"jlng":{"n":"Jumping lunges","t":"Lunge, jump, switch legs in the air, land soft.","h":"Quiet version: fast alternating reverse lunges","i":"Split_Jump","m":["quadriceps"],"s":["Assume a lunge stance position with one foot forward with the knee bent, and the rear knee nearly touching the ground.","Ensure that the front knee is over the midline of the foot.","Extending through both legs, jump as high as possible, swinging your arms to gain lift.","As you jump, bring your feet together, and move them back to their initial positions as you land.","Absorb the impact by reverting back to the starting position."]},"pfp":{"n":"Plate front presses","t":"Hold the plate at the chest and press it straight forward, then back.","h":"Use the slam ball or a dumbbell"},"psq":{"n":"Plate squat","t":"Hold the plate at the chest and squat deep.","h":"Goblet squat with the kettlebell","i":"Goblet_Squat","m":["quadriceps"],"s":["Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.","Squat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.","At the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."]},"plsl":{"n":"Plank slides","t":"Forearm plank, rock the whole body forward and back (use sliders or a towel under the feet)."},"dbsq":{"n":"Dumbbell squats","t":"Dumbbells at your sides, sit back and down, chest up.","i":"Dumbbell_Squat","m":["quadriceps"],"s":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise your torso as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},"bhd":{"n":"Bench hops to dips","t":"Hands on the bench, hop the feet side to side over it, then do a dip. Repeat.","h":"Lateral hops over a line, then chair dips","i":"Bench_Dips","m":["triceps"],"s":["For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.","Slowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.","Using your triceps to bring your torso up again, lift yourself back to the starting position.","Repeat for the recommended amount of repetitions."]},"ohl":{"n":"Overhead lunges","t":"Hold a weight locked out overhead and lunge, keeping the core tight and the arms straight.","h":"Use the slam ball or one dumbbell overhead"},"boxj":{"n":"Box jumps","t":"Swing the arms, jump, land softly on the box, step down.","h":"Squat jumps, or tuck jumps","i":"Front_Box_Jump","m":["hamstrings"],"s":["Begin with a box of an appropriate height 1-2 feet in front of you. Stand with your feet should width apart. This will be your starting position.","Perform a short squat in preparation for jumping, swinging your arms behind you.","Rebound out of this position, extending through the hips, knees, and ankles to jump as high as possible. Swing your arms forward and up.","Land on the box with the knees bent, absorbing the impact through the legs. You can jump from the box back to the ground, or preferably step down one leg at a time."]},"wpwu":{"n":"Walking plank to wave unload","t":"Walk out to a plank, wave through the spine, walk back.","i":"Inchworm","m":["hamstrings"],"s":["Stand with your feet close together. Keeping your legs straight, stretch down and put your hands on the floor directly in front of you. This will be your starting position.","Begin by walking your hands forward slowly, alternating your left and your right. As you do so, bend only at the hip, keeping your legs straight.","Keep going until your body is parallel to the ground in a pushup position.","Now, keep your hands in place and slowly take short steps with your feet, moving only a few inches at a time.","Continue walking until your feet are by hour hands, keeping your legs straight as you do so."]},"bolr":{"n":"Bent-over lateral raises","t":"Hinge forward, raise the arms to the sides, lead with the elbows. Rear delts.","i":"Seated_Bent-Over_Rear_Delt_Raise","m":["shoulders"],"s":["Place a couple of dumbbells looking forward in front of a flat bench.","Sit on the end of the bench with your legs together and the dumbbells behind your calves.","Bend at the waist while keeping the back straight in order to pick up the dumbbells. The palms of your hands should be facing each other as you pick them. This will be your starting position.","Keeping your torso forward and stationary, and the arms slightly bent at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. (Note: avoid swinging the torso or bringing the arms back as opposed to the side.)","After a one second contraction at the top, slowly lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},"ibfr":{"n":"Incline bench dumbbell front raises","t":"Back on an incline bench, raise the dumbbells forward to shoulder height.","h":"Standing front raises","i":"Front_Incline_Dumbbell_Raise","m":["shoulders"],"s":["Sit down on an incline bench with the incline set anywhere between 30 to 60 degrees while holding a dumbbell on each hand. Tip: You can change the angle to hit the muscle a little differently each time.","Extend your arms straight in front of you and have your palms facing down with the dumbbells raised about 1 inch above your thighs. This will be your starting position.","Slowly raise the dumbbells straight up until they are slightly above your shoulders, while keeping your elbows locked. Squeeze at the top for a second and make sure you breathe out during this portion of the movement. Tip: Keep your head resting down against the bench and your legs on the floor at all times.","Lower the arms back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},"kdp":{"n":"Kneeling dumbbell presses","t":"Tall kneel, squeeze the glutes, press overhead without arching.","i":"Dumbbell_One-Arm_Shoulder_Press","m":["shoulders"],"s":["Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight.","Clean the dumbbell up to bring it to shoulder height. The other hand can be kept fully extended to the side, by the waist or grabbing a fixed surface.","Rotate the wrist so that the palm of your hand is facing forward. This is your starting position.","As you exhale, push the dumbbell up until your arm is fully extended.","After a second pause, slowly come down back to the starting position as you inhale.","Repeat for the recommended amount of repetitions and then switch arms."]},"vsbs":{"n":"V-sit ball slams","t":"Hold a V-sit, lift the ball overhead and slam it down beside your hip, alternating sides.","h":"Use the slam ball"},"wpp2":{"n":"Weighted plate plank","t":"Forearm plank with a plate on the upper back. Brace hard.","h":"Plank with the slam ball or a backpack on your back","i":"Plank","m":["abdominals"],"s":["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.","Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."]},"wbs":{"n":"Side-to-side wall ball slams","t":"Rotate and slam or throw the ball against the wall from each side.","h":"Slam ball to the floor, alternating sides","i":"Overhead_Slam","m":["lats"],"s":["Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.","Initiate the countermovement by raising the ball above your head and fully extending your body.","Reverse the motion, slamming the ball into the ground directly in front of you as hard as you can.","Receive the ball with both hands on the bounce and repeat the movement."]},"bpr":{"n":"Resistance-band press","t":"Band behind the back, press forward and up."},"obs":{"n":"Overhead band stretch","t":"Hold the band wide overhead, arms straight, stretch."},"rbs":{"n":"360° rotation band stretch","t":"Wide grip on the band, slowly circle it from the front, overhead, and behind (shoulder dislocates)."},"obsp":{"n":"Overhead band stretch with pulses","t":"Overhead band stretch with small pulses to each side."},"slam":{"n":"Ball slams","t":"Raise the ball overhead on your toes, slam it down with the whole body.","h":"Your 4 kg slam ball","i":"Overhead_Slam","m":["lats"],"s":["Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.","Initiate the countermovement by raising the ball above your head and fully extending your body.","Reverse the motion, slamming the ball into the ground directly in front of you as hard as you can.","Receive the ball with both hands on the bounce and repeat the movement."]}};

function figLoop(){cancelAnimationFrame(figRAF);const t0=performance.now();const step=now=>{const els=document.querySelectorAll("svg[data-anim]");if(!els.length){figRAF=null;return}els.forEach(svg=>{const f=FIG[svg.dataset.anim],seq=f.p;if(seq.length<2)return;const d=f.d||1100,h=f.h??350,TT=d+h,t=now-t0,i=Math.floor(t/TT)%seq.length,u=Math.min(1,(t%TT)/d),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,A=seq[i],B=seq[(i+1)%seq.length];figDraw(svg,A.map((v,k)=>v+(B[k]-v)*e))});figRAF=requestAnimationFrame(step)};figRAF=requestAnimationFrame(step)}

 if(L.length<2)return `<div class="empty">Log at least 2 ${key==="w"?"weigh-ins":"waist measurements"} to see your trend line.</div>`;
 const W=340,H=180,pl=32,pr=58,pt=16,pb=24,xs=L.map(x=>pd(x.d).getTime()),ys=L.map(x=>x[key]);
 const x0=xs[0],x1=Math.max(xs.at(-1),x0+864e5),mn=Math.min(...ys),mx=Math.max(...ys),sp=Math.max(mx-mn,2);let ts=1;while(sp/ts>4)ts*=2;
 const y0=Math.floor((mn-sp*.15)/ts)*ts,y1=Math.ceil((mx+sp*.15)/ts)*ts,X=v=>pl+(v-x0)/(x1-x0)*(W-pl-pr),Y=v=>pt+(y1-v)/(y1-y0)*(H-pt-pb);
 const pts=L.map((x,i)=>[X(xs[i]),Y(ys[i]),x.d,ys[i]]);let g="";
 for(let v=y0;v<=y1+1e-9;v+=ts)g+=`<line class="grid" x1="${pl}" x2="${W-pr+8}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-6}" y="${Y(v)+3.5}" text-anchor="end">${+v.toFixed(1)}</text>`;
 const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(""),last=pts.at(-1),area=line+`L${last[0].toFixed(1)} ${H-pb}L${pts[0][0].toFixed(1)} ${H-pb}Z`;

}
