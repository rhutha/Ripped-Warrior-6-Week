 const done=Object.keys(S.done).filter(k=>S.done[k].W&&!isRest(+k)).length,trained=[...Array(42)].filter((_,i)=>!isRest(i+1)).length;
 let streak=0;for(let i=Math.min(n,42);i>=1;i--){if(getd(i,"W"))streak++;else if(isRest(i)||i===n)continue;else break}
 const L=[...S.logs].sort((a,b)=>a.d<b.d?-1:1),wl=L.filter(x=>x.w),dw=wl.length>1?wl.at(-1).w-wl[0].w:null;
 let h=`<div class="stats"><div class="stat"><div class="k">Workouts</div><div class="v">${done}<span class="u">/${trained}</span></div><div class="u">completed</div></div><div class="stat"><div class="k">Streak</div><div class="v">${streak}</div><div class="u">workouts 🔥</div></div><div class="stat"><div class="k">Weight</div><div class="v">${dw===null?"—":(dw>0?"+":"")+dw.toFixed(1)}</div><div class="u">kg since start</div></div></div>`;
 const TT=[...S.times].sort((a,b)=>a.n-b.n),best=TT.length?Math.min(...TT.map(x=>x.s)):null;
 h+=sh("300-rep finisher times")+(TT.length?`<div class="list flat">${TT.map(x=>`<div class="cell"><div class="ct"><div class="t1">Week ${wdOf(x.n).w} · ${fd(x.d)}</div></div><span class="val" style="color:${x.s===best?"var(--green)":"var(--l2)"};font-weight:600">${fmtC(x.s)}${x.s===best?" 🏆":""}</span></div>`).join("")}</div>`:`<div class="card"><div class="empty" style="padding:14px">Shoulder / Abs days end with 300 reps for time. Use the guided workout stopwatch and your times appear here. Beat them every week!</div></div>`);
 h+=sh("Trend")+`<div class="card">${seg("ck",["Weight","Waist"],ck==="w"?0:1)}${chart(ck)}</div>`;
 let cal=`<div class="wl"></div>${[1,2,3,4,5,6,7].map(x=>`<div class="wl" style="text-align:center">D${x}</div>`).join("")}`;
 for(let w=0;w<6;w++){cal+=`<div class="wl">W${w+1}</div>`;for(let j=1;j<=7;j++){const i=w*7+j,ok=getd(i,"W"),r=isRest(i),ms=!ok&&!r&&i<n;cal+=`<div class="c ${ok?"ok":ms?"ms":""} ${i===n?"td":""}" data-gow="${w+1}" data-god="${j}" title="${fd(dateOf(i))}">${ok?"✓":r?"😴":i}</div>`}}
 h+=sh("6-week calendar")+`<div class="card"><div class="cal">${cal}</div><div class="legend"><span><i style="background:var(--green)">✓</i>Done</span><span><i style="background:color-mix(in srgb,var(--red) 16%,transparent)"></i>Missed</span><span>😴 Rest</span><span><i style="box-shadow:inset 0 0 0 2px var(--tint)"></i>Today</span></div></div>`;
 h+=sh("Log measurements")+`<div class="list"><label class="fm"><span>Date</span><input type="date" id="lgD" value="${t}"></label><label class="fm"><span>Weight</span><input type="number" step="0.1" id="lgW" inputmode="decimal" placeholder="kg"></label><label class="fm"><span>Waist at navel</span><input type="number" step="0.5" id="lgWa" inputmode="decimal" placeholder="cm"></label><label class="fm"><textarea id="lgN" rows="2" placeholder="Notes: energy, sleep, PRs"></textarea></label></div><button class="btn" id="lgSave">Save entry</button>`+sf("Weigh weekly: same day, morning, before food.");
 if(L.length)h+=sh("History")+`<div class="list flat">${L.slice().reverse().map(x=>`<div class="cell"><div class="ct"><div class="t1">${fd(x.d)}</div><div class="t2">${[x.w?x.w+" kg":"",x.wa?x.wa+" cm waist":""].filter(Boolean).join(" · ")}${x.n?"<br>"+esc(x.n):""}</div></div><button class="del" data-del="${x.d}" aria-label="Delete">×</button></div>`).join("")}</div>`;
 h+=sh("Program")+`<div class="list"><label class="fm"><span>Start date (Week 1 · Day 1)</span><input type="date" id="startD" value="${S.start}"></label></div>`+sf("Missed days? Move the start date later to shift the whole plan.");
 h+=sh("Backup")+`<div class="list flat"><div class="cell tap" id="exp"><div class="ct"><div class="t1" style="color:var(--tint)">Export data</div></div></div><label class="cell tap"><div class="ct"><div class="t1" style="color:var(--tint)">Import data</div></div><input type="file" id="imp" accept=".json" class="hide"></label><div class="cell tap" id="rst"><div class="ct"><div class="t1" style="color:var(--red)">Reset everything</div></div></div></div>`+sf("Data is stored only on this device.");
 $("v-plan").innerHTML=h;bindChart();
}

/* ================= GUIDED PLAYER ================= */
let PL=null,actx=null,wlock=null;
function beep(f=880,len=.18){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+len);o.start();o.stop(actx.currentTime+len)}catch(_){}}
function buildSteps(t){
 const out=[],R=sec=>out.push({rest:sec});
 t.b.forEach((b,bi)=>{const bh=b.h,bl=t.b.length-1===bi;
  if(b.k==="sets")b.x.forEach((x,ii)=>{const ids=[].concat(x.e),k=`b${bi}-${ii}`;for(let s=1;s<=x.s;s++){ids.forEach((id,j)=>out.push({id,bh,lab:x.r+(/s$|min$/.test(x.r)?"":" reps"),sec:x.sec,sub:`Set ${s} of ${x.s}${ids.length>1?` · superset ${j+1}/${ids.length}`:""}`,dots:[s,x.s],mark:s===x.s&&j===ids.length-1?k:null}));if(!(s===x.s&&ii===b.x.length-1))R(x.rest)}});
  else if(b.k==="circ")for(let r=1;r<=b.n;r++){b.x.forEach((x,ii)=>{out.push({id:x.e,bh,lab:x.r,sec:x.sec,flow:!!x.sec,sub:b.n>1?`Round ${r} of ${b.n}`:"",dots:b.n>1?[r,b.n]:null,mark:r===b.n?`b${bi}-${ii}`:null});if(b.ri&&!(r===b.n&&ii===b.x.length-1))R(b.ri)});if(r<b.n&&b.rr)R(b.rr)}
  else if(b.k==="list")b.x.forEach((x,ii)=>out.push({id:x.e,bh,lab:x.r,sec:x.sec,sub:"",mark:`b${bi}-${ii}`}));
  else if(b.k==="emom")for(let m=1;m<=b.min;m++){const x=b.x[(m-1)%b.x.length];out.push({id:x.e,bh,lab:x.r+" — then rest until the minute is up",sec:60,flow:true,sub:`Minute ${m} of ${b.min}`,dots:null,mark:m>=b.min-1?`b${bi}-${(m-1)%b.x.length}`:null})}
  else if(b.k==="time")out.push({time:true,bh,x:b.x,bi});
 });
 return out;
}
function startPlayer(n){
 const t=tplOf(n),steps=buildSteps(t);let i=0;
 PL={n,steps,i,mode:"work",timer:null,left:0,total:0,sw:0,swOn:false,swT:null,ticks:{}};
 $("pl").classList.add("open");document.body.style.overflow="hidden";
 if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>wlock=l).catch(()=>{});
 beep(660,.01);goStep(firstOpen());
}
function firstOpen(){const s=PL.steps;for(let i=0;i<s.length;i++){if(s[i].rest)continue;const m=s[i].mark||(s[i].time?`b${s[i].bi}-0`:null);if(!m||!getd(PL.n,m))return i;}return 0}
function closePlayer(){if(!PL)return;clearInterval(PL.timer);clearInterval(PL.swT);PL=null;$("pl").classList.remove("open");document.body.style.overflow="";if(wlock){wlock.release().catch(()=>{});wlock=null}setTimeout(()=>{if(!PL)$("pl").innerHTML=""},480);show(cur)}
const workIdx=()=>PL.steps.map((s,i)=>s.rest?-1:i).filter(i=>i>=0);
function ring(left,total,rest,label){const r=92,L=2*Math.PI*r;return `<div class="cring ${rest?"rest":""}"><svg viewBox="0 0 210 210"><circle class="tr" cx="105" cy="105" r="${r}"/><circle class="fg" id="cfg" cx="105" cy="105" r="${r}" style="stroke-dasharray:${L};stroke-dashoffset:${L*(1-left/total)}"/></svg><div class="n"><b id="cnum">${fmtT(left)}</b><span>${label}</span></div></div>`}
function goStep(i){clearInterval(PL.timer);PL.i=i;const s=PL.steps[i];if(!s){finish();return}if(s.rest){countdown(s.rest,"rest",()=>goStep(i+1));return}PL.mode="work";draw();if(s.sec&&s.flow&&PL.auto)countdown(s.sec,"timer",()=>doneStep())}
function nextWork(i){for(let j=i+1;j<PL.steps.length;j++)if(!PL.steps[j].rest)return PL.steps[j];return null}
function draw(){
 const P=PL,s=P.steps[P.i],W=workIdx(),pos=W.indexOf(P.i),tot=W.length;
 let h=`<div class="plh"><button class="x" data-pl="close" aria-label="Close">✕</button><div class="c">${P.mode==="done"?"Finished":`Step ${Math.max(pos,0)+1} of ${tot}`}</div><span style="width:34px"></span></div><div class="plbar"><i style="width:${(P.mode==="done"?1:Math.max(pos,0)/tot)*100}%"></i></div>`;
 if(P.mode==="done"){h+=`<div class="fin"><div class="big">🏆</div><h2>Warrior session done!</h2><p>Drink water, get your protein in, and rest up.</p></div><div class="plsp"></div><button class="btn" data-pl="close">Back</button>`}
 else if(P.mode==="rest"){const up=nextWork(P.i);h+=`<div class="plsp"></div><div class="plt">${ring(P.left,P.total,true,"Rest")}</div><div class="plrow"><button class="btn gray" data-pl="plus">+15s</button><button class="btn" data-pl="skip">Skip rest</button></div>${up&&!up.time?`<div class="upnext">${thumb(up.id)}<div class="ct"><div class="k">Up next${up.sub?" · "+up.sub:""}</div><div class="v">${esc(nm(up.id))}</div><div class="k rx">${esc(up.lab)}</div></div></div>`:""}<div class="plsp"></div>`}
 else if(s.time){const best=S.times.length?Math.min(...S.times.map(x=>x.s)):null;
  h+=`<div class="sf" style="margin:0 2px">${esc(s.bh)}</div><div class="pln">300 reps for time</div><div class="sw" id="swv">${fmtC(P.sw)}</div><div class="swl">${best!==null?`Best: ${fmtC(best)} — beat it!`:"First attempt — set your benchmark"}</div>
  <div class="list mt">${s.x.map((x,j)=>`<div class="cell ${P.ticks[j]?"dn":""}">${thumb(x.e)}<div class="ct"><div class="t1">${esc(nm(x.e))}</div><div class="t2 rx">${x.r} reps</div></div><button class="chk ${P.ticks[j]?"on":""}" data-swt="${j}"></button></div>`).join("")}</div><div class="plsp"></div>
  ${P.swOn?`<button class="btn" data-pl="swstop">⏹ Finish & save time</button>`:`<button class="btn" data-pl="swgo">${P.sw?"▶ Resume":"▶ Start stopwatch"}</button>`}${P.sw&&!P.swOn?`<button class="btn gray" data-pl="swstop" style="margin-top:8px">Save ${fmtC(P.sw)}</button>`:""}`}
 else{const x=EX[s.id];
  h+=`${media(s.id)}<div class="sf" style="margin:8px 2px 0">${esc(s.bh)}</div><div class="pln">${esc(x.n)}</div><span class="badge" style="align-self:flex-start;margin-top:8px;font-size:14px">${esc(s.lab)}</span>
   ${s.dots?`<div class="pldots">${Array.from({length:s.dots[1]},(_,j)=>`<i class="${j<s.dots[0]-1?"on":""}"></i>`).join("")}</div>`:""}${s.sub?`<div class="sf" style="margin:6px 2px 0">${s.sub}</div>`:""}
   <div class="tipbox" style="font-size:14px">${esc(x.t)}</div>${S.mode==="home"&&x.h?`<div class="tipbox" style="font-size:14px;background:color-mix(in srgb,var(--r3) 13%,var(--bg2))"><b style="color:var(--r3)">🏠 Home · </b>${esc(x.h)}</div>`:""}<div class="plsp"></div>`;
  if(P.mode==="timer")h+=`<div class="plt">${ring(P.left,P.total,false,"Go!")}</div><button class="btn gray" data-pl="setdone">Finish early</button>`;
  else h+=s.sec?`<button class="btn" data-pl="go">▶ Start ${s.sec<60?s.sec+"s":fmtT(s.sec)} timer</button><button class="btn gray" data-pl="setdone" style="margin-top:8px">Done without timer</button>`:`<button class="btn" data-pl="setdone">✓ Done</button>`;
  h+=`<div class="plrow"><button class="btn gray" data-pl="prev" ${pos<=0?"disabled style='opacity:.4'":""}>‹ Previous</button><button class="btn gray" data-pl="next">Skip ›</button></div>`}
 $("pl").innerHTML=h;figLoop();
}
function countdown(sec,mode,done){clearInterval(PL.timer);PL.mode=mode;PL.left=sec;PL.total=sec;draw();PL.timer=setInterval(()=>{if(!PL)return;PL.left--;if(PL.left<=3&&PL.left>0)beep(660,.1);if(PL.left<=0){clearInterval(PL.timer);beep(990,.35);haptic();done();return}const c=$("cfg"),L=2*Math.PI*92;if(c)c.style.strokeDashoffset=L*(1-PL.left/PL.total);const e=$("cnum");if(e)e.textContent=fmtT(PL.left)},1000)}
function doneStep(){const s=PL.steps[PL.i];clearInterval(PL.timer);haptic();if(s.mark)setd(PL.n,s.mark,true);if(!s.flow)PL.auto=false;goStep(PL.i+1)}
function finish(){clearInterval(PL.timer);setd(PL.n,"W",true);PL.mode="done";draw();confetti($("pl").querySelector(".fin"));toast("⚔️ Workout logged!")}
document.addEventListener("click",ev=>{
 const b=ev.target.closest("[data-pl],[data-swt]");if(!b)return;
 if(b.dataset.pl==="start"){haptic();startPlayer(+b.dataset.n);return}
 if(!PL)return;const a=b.dataset.pl,s=PL.steps[PL.i];
 if(b.dataset.swt!==undefined){const j=+b.dataset.swt;PL.ticks[j]=!PL.ticks[j];haptic();draw();return}
 if(a==="close")closePlayer();
 else if(a==="go"){haptic();beep(880,.15);PL.auto=!!s.flow;countdown(s.sec,"timer",()=>doneStep())}
 else if(a==="setdone")doneStep();
 else if(a==="skip"){goStep(PL.i+1)}
 else if(a==="plus"){PL.left+=15;PL.total+=15}
 else if(a==="next"){PL.auto=false;let j=PL.i+1;while(PL.steps[j]&&PL.steps[j].rest)j++;goStep(j)}
 else if(a==="prev"){PL.auto=false;let j=PL.i-1;while(j>0&&PL.steps[j].rest)j--;if(j>=0)goStep(j)}
 else if(a==="swgo"){haptic();beep(880,.15);PL.swOn=true;const t0=Date.now()-PL.sw*1000;PL.swT=setInterval(()=>{PL.sw=Math.floor((Date.now()-t0)/1000);const e=$("swv");if(e)e.textContent=fmtC(PL.sw)},250);draw()}
 else if(a==="swstop"){clearInterval(PL.swT);PL.swOn=false;if(PL.sw>0){S.times=S.times.filter(x=>x.n!==PL.n);S.times.push({n:PL.n,d:ymd(new Date()),s:PL.sw});save();setd(PL.n,`b${s.bi}-0`,true);s.x.forEach((_,j)=>setd(PL.n,`b${s.bi}-${j}`,true));toast("⏱ Time saved: "+fmtC(PL.sw))}goStep(PL.i+1)}
});

/* ================= NAV & EVENTS ================= */
const R={today:renderToday,prog:renderProg,diet:renderDiet,plan:renderPlan};
let cur="today";
function show(v){cur=v;document.querySelectorAll("main>section").forEach(s=>{const on=s.id==="v-"+v;s.classList.toggle("hide",!on);s.classList.remove("in");if(on){void s.offsetWidth;s.classList.add("in")}});document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));R[v]();window.scrollTo(0,0);onScroll()}
function onScroll(){$("nb").classList.toggle("sc",window.scrollY>36)}
window.addEventListener("scroll",onScroll,{passive:true});
$("nav").addEventListener("click",ev=>{const b=ev.target.closest("button");if(b){haptic();if(b.dataset.v===cur)window.scrollTo({top:0,behavior:"smooth"});else show(b.dataset.v)}});
$("sbg").addEventListener("click",closeSheet);
const SEG={mode:j=>{S.mode=j?"home":"gym";save();R[cur]()},wk:j=>{pv.w=j+1;renderProg()},veg:j=>{S.veg=!!j;save();renderDiet()},ck:j=>{ck=j?"wa":"w";renderPlan()}};
document.addEventListener("click",ev=>{
 const x=ev.target.closest("button,[data-ex],[data-goday],[data-gow],#exp,#rst");if(!x||x.closest("#nav")||x.closest("#pl"))return;
 if(x.classList.contains("chk")){ev.stopPropagation();const on=!x.classList.contains("on");haptic();x.classList.toggle("on",on);x.closest(".cell").classList.toggle("dn",on);if(x.dataset.g)seth(x.dataset.g,x.dataset.d,x.dataset.k,on);else setd(+x.dataset.n,x.dataset.k,on);if(cur==="today")refreshToday();return}
 const sg=x.closest(".segc");
 if(sg&&x.dataset.sv!==undefined){const j=+x.dataset.sv;if(+sg.style.getPropertyValue("--i")===j)return;haptic();sg.style.setProperty("--i",j);sg.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k===j));setTimeout(()=>SEG[sg.dataset.seg](j),230);return}
 if(x.dataset.pd){haptic();pv.d=+x.dataset.pd;renderProg();return}
 if(x.dataset.dd){haptic();dd=+x.dataset.dd;renderDiet();return}
 if(x.dataset.ex){haptic();openSheet(x.dataset.ex.split(","),x.dataset.rx);return}
 if(x.dataset.goday){const n=+x.dataset.goday;pv={w:wdOf(n).w,d:wdOf(n).d};show("prog");return}
 if(x.dataset.gow){pv={w:+x.dataset.gow,d:+x.dataset.god};if(cur==="prog"){renderProg();window.scrollTo({top:0,behavior:"smooth"})}else show("prog");return}
 if("close" in x.dataset){closeSheet();return}
 if(x.id==="wdone"){const n=+x.dataset.n,on=!getd(n,"W");setd(n,"W",on);haptic();x.classList.toggle("done",on);x.textContent=on?"✓ Workout complete":"Complete workout";refreshToday();if(on){confetti(x);toast("⚔️ Workout logged!")}return}
 if(x.dataset.del){if(confirm("Delete the entry for "+fd(x.dataset.del)+"?")){S.logs=S.logs.filter(l=>l.d!==x.dataset.del);save();renderPlan()}return}
 if(x.id==="lgSave"){const d=$("lgD").value,w=parseFloat($("lgW").value),wa=parseFloat($("lgWa").value);if(!d||(!w&&!wa)){toast("Enter weight or waist");return}S.logs=S.logs.filter(l=>l.d!==d);S.logs.push({d,w:w||null,wa:wa||null,n:$("lgN").value});save();haptic();renderPlan();toast("✓ Saved");return}
 if(x.id==="exp"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="ripped-warrior-backup-"+ymd(new Date())+".json";a.click();return}
 if(x.id==="rst"){if(confirm("Erase ALL progress, logs and settings?")){localStorage.removeItem("rw");location.reload()}return}
});
document.addEventListener("change",ev=>{const x=ev.target;
 if(x.id==="startD"&&x.value){S.start=x.value;save();pv={w:null,d:null};renderPlan();toast("Start date updated")}
 if(x.id==="imp"&&x.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.start&&o.done){S=o;save();show(cur);toast("✓ Imported")}else toast("Invalid file")}catch(_){toast("Invalid file")}};r.readAsText(x.files[0])}
});
let lastDay=ymd(new Date());
function dayCheck(){const d=ymd(new Date());if(d!==lastDay){lastDay=d;pv={w:null,d:null};dd=null;if(!PL)show(cur)}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)dayCheck()});
setInterval(dayCheck,60000);
show("today");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
